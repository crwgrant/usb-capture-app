[package]
name = "shadowcast-app"
version = "0.1.0"
edition = "2024"
description = "A low-latency GPUI viewer for Genki ShadowCast UVC capture devices"
license = "MIT"

[dependencies]
cpal = { version = "0.18", features = ["pipewire", "pulseaudio"] }
env_logger = "0.11"
gpui-kit = { version = "0.9", features = ["gpui-fast"] }
image = { version = "0.25", default-features = false }
log = "0.4"
nokhwa = { version = "0.10", features = ["input-native"] }
parking_lot = "0.12"
zune-core = "0.5"
zune-jpeg = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.release]
lto = "thin"
